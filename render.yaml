services:
  - type: web
    name: ai-arena-3-skyline
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /api/state
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: AI_ARENA_DB_PATH
        value: /tmp/ai_arena_3.sqlite
